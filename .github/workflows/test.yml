name: Test

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

defaults:
  run:
    working-directory: revision-app

jobs:
  fast-checks:
    name: Typecheck, lint, unit/integration/component/security tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: revision-app/package-lock.json

      - run: npm ci
      - run: npx prisma generate

      - run: npx tsc --noEmit
      - run: npm run lint

      # tests/setup/env.ts pins DATABASE_URL to a dedicated prisma/test.db (never
      # prisma/dev.db) and provides a throwaway AUTH_SECRET fallback — no CI-specific
      # env vars are needed for this job.
      - run: npm test

  e2e:
    name: E2E, accessibility, and performance (Playwright)
    runs-on: ubuntu-latest
    # Only on PRs and manual runs — the browser suite is slow, so pushes to master
    # (already covered by fast-checks) don't pay that cost on every commit.
    if: github.event_name == 'pull_request' || github.event_name == 'workflow_dispatch'
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: revision-app/package-lock.json

      - run: npm ci
      - run: npx prisma generate

      # GitHub's runners have no system Chrome — playwright.config.ts uses
      # `channel: "chrome"` (real Chrome, not the Chromium build) to match what this
      # app is actually verified against locally, so install that exact channel here
      # too rather than switching CI to a different browser.
      - run: npx playwright install --with-deps chrome

      - run: npm run build
        env:
          # Build-time only; no page queries the DB during static generation, but this
          # keeps the build's environment consistent with the E2E run that follows it.
          DATABASE_URL: file:./prisma/e2e.db
          AUTH_SECRET: ci-only-throwaway-secret-not-used-in-production-0123456789

      - run: npx playwright test
        env:
          # playwright.config.ts's webServer already pins DATABASE_URL to prisma/e2e.db;
          # AUTH_SECRET has no such default and next start (production mode) refuses to
          # run without one.
          AUTH_SECRET: ci-only-throwaway-secret-not-used-in-production-0123456789

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-report
          path: |
            revision-app/playwright-report/
            revision-app/test-results/
          retention-days: 14

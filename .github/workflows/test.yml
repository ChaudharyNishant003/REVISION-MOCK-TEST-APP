name: Test

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

defaults:
  run:
    working-directory: revision-app

jobs:
  fast-checks:
    name: Typecheck, lint, unit/integration/component/security tests
    runs-on: ubuntu-latest
    env:
      # prisma.config.ts calls env("DATABASE_URL") while *loading* the config, so even
      # `prisma generate` needs this set — there's no .env file in CI to supply it.
      # tests/setup/env.ts pins the same value again at Vitest runtime; this just lets
      # `prisma generate` itself succeed. AUTH_SECRET has its own fallback in that file,
      # so it doesn't need to be set here.
      DATABASE_URL: file:./prisma/test.db
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: revision-app/package-lock.json

      - run: npm ci
      - run: npx prisma generate

      - run: npx tsc --noEmit
      - run: npm run lint
      - run: npm test

  e2e:
    name: E2E, accessibility, and performance (Playwright)
    runs-on: ubuntu-latest
    # Only on PRs and manual runs — the browser suite is slow, so pushes to master
    # (already covered by fast-checks) don't pay that cost on every commit.
    if: github.event_name == 'pull_request' || github.event_name == 'workflow_dispatch'
    env:
      # Needed from `prisma generate` onward (see the comment in fast-checks above),
      # then reused by `next build` and by playwright.config.ts's webServer.
      DATABASE_URL: file:./prisma/e2e.db
      # next start (production mode) refuses to run without this; no default exists
      # the way AUTH_SECRET's Vitest-only fallback does. Throwaway CI value only.
      AUTH_SECRET: ci-only-throwaway-secret-not-used-in-production-0123456789
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: revision-app/package-lock.json

      - run: npm ci
      - run: npx prisma generate

      # GitHub's runners have no system Chrome — playwright.config.ts uses
      # `channel: "chrome"` (real Chrome, not the Chromium build) to match what this
      # app is actually verified against locally, so install that exact channel here
      # too rather than switching CI to a different browser.
      - run: npx playwright install --with-deps chrome

      - run: npm run build
      - run: npx playwright test

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-report
          path: |
            revision-app/playwright-report/
            revision-app/test-results/
          retention-days: 14
